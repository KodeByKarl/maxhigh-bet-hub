# Install only after a second non-root key login, sudo and provider console are verified.
# No SSH port change, AllowUsers list, bespoke cipher policy or forced command.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
MaxAuthTries 3
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
GatewayPorts no
PermitTunnel no
