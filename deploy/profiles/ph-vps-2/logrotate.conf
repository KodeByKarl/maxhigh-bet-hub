# Install into /etc/logrotate.d/maxhigh; run its own timer hourly.
# Operational logs only. Never include SQL data, ledger or application audit tables.
/srv/maxhigh/deploy/logs/*-out.log /srv/maxhigh/deploy/logs/*-error.log {
    su maxhigh maxhigh
    hourly
    maxsize 10M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
/var/log/mysql/maxhigh-slow.log /var/log/mysql/maxhigh-error.log {
    su mysql adm
    hourly
    maxsize 10M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 mysql adm
    sharedscripts
    postrotate
        /usr/bin/mariadb-admin --defaults-extra-file=/etc/mysql/debian.cnf --local flush-logs >/dev/null
    endscript
}
