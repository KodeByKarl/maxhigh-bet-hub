name: Manually deploy isolated staging
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter STAGING ONLY; this workflow cannot deploy production'
        required: true
        type: string
      build_only:
        description: 'Build an artifact only; keep true for first-transfer preparation'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: maxhigh-staging-deployment
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main' && inputs.confirmation == 'STAGING ONLY'
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: build
    if: ${{ !inputs.build_only && vars.STAGING_DEPLOY_ENABLED == 'true' && github.event.repository.private == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      actions: read
    steps:
      # No source checkout or npm hooks run in the job holding the SSH key.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artifact
          merge-multiple: true
      - name: Send verified artifact to restricted staging receiver
        shell: bash
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_PORT: ${{ vars.STAGING_SSH_PORT }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          MANIFEST_HASH: ${{ needs.build.outputs.manifest-sha256 }}
          ARCHIVE_HASH: ${{ needs.build.outputs.archive-sha256 }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$STAGING_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$STAGING_PORT" =~ ^[0-9]{1,5}$ ]] && (( STAGING_PORT > 0 && STAGING_PORT < 65536 ))
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$MANIFEST_HASH" =~ ^[a-f0-9]{64}$ && "$ARCHIVE_HASH" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  artifact/release.tgz\n' "$ARCHIVE_HASH" | sha256sum --check --strict
          keydir=$(mktemp -d)
          trap 'rm -f -- "$keydir/key" "$keydir/known_hosts"; rmdir -- "$keydir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keydir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keydir/known_hosts"
          unset SSH_KEY KNOWN_HOSTS
          ssh -F /dev/null -T -p "$STAGING_PORT" -i "$keydir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$keydir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "maxhigh-stage@$STAGING_HOST" "deploy $RELEASE_SHA $MANIFEST_HASH $ARCHIVE_HASH" < artifact/release.tgz
