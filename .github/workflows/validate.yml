name: Validate and build Linux artifact
on:
  pull_request:
  push:
    branches: [main, 'ci/staging-artifact-*']
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}
      sha:
        value: ${{ jobs.build.outputs.sha }}
      manifest-sha256:
        value: ${{ jobs.build.outputs.manifest-sha256 }}
      archive-sha256:
        value: ${{ jobs.build.outputs.archive-sha256 }}
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        # Official MariaDB 10.11.19 Linux amd64 digest, reviewed 2026-11-08.
        image: mariadb@sha256:6c65a843396dc6c78dd0da19eccaa0a91d25d9d26a4c2afcb75010ac3f59f5ea
        env:
          MARIADB_ROOT_PASSWORD: audit-local-only
          MARIADB_ROOT_HOST: '%'
        ports:
          - '127.0.0.1:19307:3306'
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha: ${{ steps.build.outputs.sha }}
      manifest-sha256: ${{ steps.build.outputs.manifestSha256 }}
      archive-sha256: ${{ steps.build.outputs.archiveSha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Frozen dependencies
        run: npm ci --include=dev
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Test restricted receiver
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Install pinned disposable browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --ignore-scripts playwright@1.65.0
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Validate and build
        id: build
        run: node deploy/ci/build-artifact.mjs
        env:
          TEST_OUTPUT: audit/ubuntu-staging/runtime/unit
          MIGRATION_OUTPUT: audit/ubuntu-staging/runtime/migrations
          INTEGRATION_OUTPUT: audit/ubuntu-staging/runtime/integration
          BROWSER_OUTPUT: audit/ubuntu-staging/runtime/browser
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-tools/node_modules/playwright
          PREVIEW_TEST_OUTPUT: audit/ubuntu-staging/runtime/preview
      - name: Immutable Linux artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-node24-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            audit/ubuntu-staging/runtime/ci/release.tgz
            audit/ubuntu-staging/runtime/ci/metadata.json
            audit/ubuntu-staging/runtime/ci/SHA256SUMS
            audit/ubuntu-staging/runtime/ci/public-assets.json
            audit/ubuntu-staging/runtime/ci/safe-extract.py
            audit/ubuntu-staging/runtime/ci/artifact-contents.txt
          if-no-files-found: error
          retention-days: 14
      - name: Preserve disposable validation evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            audit/ubuntu-staging/runtime/unit/
            audit/ubuntu-staging/runtime/migrations/
            audit/ubuntu-staging/runtime/integration/
            audit/ubuntu-staging/runtime/browser/
            audit/ubuntu-staging/runtime/preview/
          if-no-files-found: ignore
          retention-days: 14
